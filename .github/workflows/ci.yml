name: Test, build Docker and publish Release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mathvs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: python3 deploy/vps/test-update.py
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
  image:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/bongachiver/mathvs
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Export the exact tested image and Compose bundle
        env:
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          BUILD_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: node .github/scripts/package-release.mjs
      - name: Verify exported image loads and starts
        run: |
          docker load --input release/mathvs-image.tar.gz
          docker compose --project-directory release -f release/compose.yaml config --quiet
          docker compose --project-directory release -f release/compose.yaml up -d --wait --wait-timeout 60
          curl --fail --retry 3 --retry-delay 2 http://localhost:3000/api/health
          docker compose --project-directory release -f release/compose.yaml down
      - name: Publish GitHub Release with downloadable Docker image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BUILD_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          RELEASE_TAG="build-${BUILD_NUMBER}-${COMMIT_SHA:0:7}"
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/mathvs-image.tar.gz release/compose.yaml release/env.example release/RELEASE.md release/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" release/mathvs-image.tar.gz release/compose.yaml release/env.example release/RELEASE.md release/SHA256SUMS --target "$COMMIT_SHA" --title "MATHVS ${RELEASE_TAG}" --notes-file release/RELEASE.md --latest
          fi
